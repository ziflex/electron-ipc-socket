name: Node CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run format
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test
            - run: npm run docs
            - run: npm run build
            - run: npm run package:smoke
            - run: npm audit --omit=dev

    electron:
        name: Electron ${{ matrix.electron }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                electron: [41.10.5, 42.9.0, 43.4.0]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Select Electron ${{ matrix.electron }}
              run: >-
                  npm install --no-save --package-lock=false
                  electron@${{ matrix.electron }}
            - run: xvfb-run --auto-servernum npm run test:electron
